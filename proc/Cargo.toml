[package]
name = "alkahest-proc"
version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[features]
evolution = []

[dependencies]
alkahest-parse.workspace = true

proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "3.0.5", features = ["derive"] }
quote = "1.0"
proc-easy = { version = "0.5.0" }
blake3 = { version = "1.8.7" }
