[package]
name = "alkahest-schema"
version.workspace = true
edition.workspace = true
description = "Portable schema snapshots and version guards for Alkahest"

[dependencies]
alkahest-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
alkahest = { path = "../alkahest", features = ["proc"] }
